name: QA source export

on:
  push:
    branches:
      - work/source-export-qa667-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package QA source
        run: |
          tar --exclude-vcs --exclude='.gradle' --exclude='*/build' -czf /tmp/lounge-tv-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lounge-tv-source-qa667
          path: /tmp/lounge-tv-source.tar.gz
          retention-days: 1
