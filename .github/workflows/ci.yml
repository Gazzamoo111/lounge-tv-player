name: Lounge TV QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lounge-tv-qa-${{ github.ref }}
  cancel-in-progress: true
env:
  LOUNGE_TV_2_QA: ${{ github.head_ref == 'feature/lounge-tv-2.0' || github.ref_name == 'feature/lounge-tv-2.0' }}
  ISOLATED_EVENT_QA: ${{ github.event_name != 'workflow_dispatch' }}
  RELIABILITY_AUDIT_QA: ${{ github.event_name != 'workflow_dispatch' }}
  LOUNGE_CORE_QA: ${{ startsWith(github.head_ref, 'core-qa/') || startsWith(github.ref_name, 'core-qa/') }}
jobs:
  tests:
    uses: ./.github/workflows/playback-tests.yml
  ui:
    uses: ./.github/workflows/tv2-ui-tests.yml
  test:
    needs: [tests, ui]
    if: ${{ !cancelled() && needs.tests.result == 'success' && (needs.ui.result == 'success' || needs.ui.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable OwnTV playback core
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
          path: shared-core
          persist-credentials: false
      - name: Apply Lounge TV playback fixes to pinned core
        run: python3 scripts/patch_lounge_playback_core.py shared-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Render transparent Lounge TV couch icons
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate_loungetv_brand_assets.py
      - name: Check branding and release guardrails
        run: |
          python3 scripts/check_branding.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Set monotonic QA version
        run: |
          set -euo pipefail
          QA_VERSION_CODE=$(python3 scripts/qa_version_code.py "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")
          echo "VERSION_CODE=$QA_VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=5.2.3.1-reliability-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      # PRs compile with an isolated ephemeral debug signer. Stable QA signing remains
      # mandatory for main/workflow_dispatch and is never supplied to untrusted PR code.
      - name: Decode persistent QA signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
          EXPECTED_QA_CERT_SHA256: ${{ vars.QA_CERT_SHA256 }}
          EXPECTED_PRODUCTION_CERT_SHA256: ${{ vars.PRODUCTION_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for n in QA_KEYSTORE_BASE64 QA_KEYSTORE_PASSWORD QA_KEY_ALIAS QA_KEY_PASSWORD EXPECTED_QA_CERT_SHA256 EXPECTED_PRODUCTION_CERT_SHA256; do
            [ -n "${!n:-}" ] || { echo "Missing required QA signing setting: $n"; exit 1; }
          done
          qa_cert=$(printf '%s' "$EXPECTED_QA_CERT_SHA256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          production_cert=$(printf '%s' "$EXPECTED_PRODUCTION_CERT_SHA256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          [ "${#qa_cert}" -eq 64 ] || { echo "QA_CERT_SHA256 is not a SHA-256 digest"; exit 1; }
          [ "$qa_cert" != "$production_cert" ] || { echo "QA and production certificates must be different"; exit 1; }
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loungetv-qa.keystore"
          echo "QA_KEYSTORE_FILE=$RUNNER_TEMP/loungetv-qa.keystore" >> "$GITHUB_ENV"
      # Public debug signing identity, scoped by Actions cache to this PR. Never a production key.
      - name: Preserve v2 QA debug identity for future checkpoints
        if: env.LOUNGE_TV_2_QA == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lounge-tv-v2qa-debug-identity-v1
      - name: Compile QA APK
        env:
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
          QA_SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' }}
          EXPECTED_QA_CERT_SHA256: ${{ vars.QA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleStandardDebug -Powntv.corePath="$GITHUB_WORKSPACE/shared-core" --stacktrace
          QA_APK=$(find app/build/outputs/apk/standard/debug -maxdepth 1 -name '*.apk' -print -quit)
          [ -n "$QA_APK" ] || { echo "QA APK was not produced"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            # Automated checks use an isolated ephemeral debug signer and never require QA secrets.
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            APK_BADGING=$("$AAPT" dump badging "$QA_APK")
            APK_ID=$(printf '%s' "$APK_BADGING" | sed -n '1p')
            echo "Built APK identity: $APK_ID"
            if [ "$LOUNGE_TV_2_QA" = "true" ]; then
              case "$APK_ID" in
                "package: name='com.loungetv.player.v2qa' versionCode='$VERSION_CODE' "*) ;;
                *) echo "Expected isolated v2qa package, got: $APK_ID"; exit 1 ;;
              esac
            elif [ "$LOUNGE_CORE_QA" = "true" ]; then
              case "$APK_ID" in
                "package: name='com.loungetv.player.catalogueqa' versionCode='$VERSION_CODE' "*) ;;
                *) echo "Expected isolated catalogueqa package, got: $APK_ID"; exit 1 ;;
              esac
            else
              case "$APK_ID" in
                "package: name='com.loungetv.player.auditqa' versionCode='$VERSION_CODE' "*) ;;
                *) echo "Expected isolated auditqa package, got: $APK_ID"; exit 1 ;;
              esac
            fi
            "$APKSIGNER" verify --print-certs "$QA_APK"
            if [ "$LOUNGE_TV_2_QA" = "true" ]; then
              python3 scripts/verify_update_compatibility.py "$QA_APK" \
                --expected-package com.loungetv.player.v2qa \
                --expected-cert-sha256 4c398a1c5614b1975ba5c64bb756125e7c39abf6b0193b3e30e0b14ad1c3949b \
                --expected-version-code "$VERSION_CODE"
            fi
          else
            EXPECTED_PACKAGE=com.loungetv.player.qa
            if [ "$LOUNGE_TV_2_QA" = "true" ]; then EXPECTED_PACKAGE=com.loungetv.player.v2qa; fi
            python3 scripts/verify_update_compatibility.py "$QA_APK" \
              --expected-package "${EXPECTED_PACKAGE}" \
              --expected-cert-sha256 "$EXPECTED_QA_CERT_SHA256" \
              --expected-version-code "$VERSION_CODE"
          fi
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOUNGE_TV_2_QA == 'true' && 'lounge-tv-2-v2qa' || env.LOUNGE_CORE_QA == 'true' && 'lounge-tv-catalogue-qa' || (github.event_name != 'workflow_dispatch' && 'lounge-tv-reliability-auditqa' || 'lounge-tv-qa') }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
