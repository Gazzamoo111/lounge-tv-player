name: Lounge TV QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check branding and release guardrails
        run: python3 scripts/check_branding.py
      - name: JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest -x :app:verifyI18nLiterals --stacktrace
      - name: Compile QA APK
        run: ./gradlew :app:assembleStandardDebug -x :app:verifyI18nLiterals --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: lounge-tv-qa
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
