name: Playback regression tests

on:
  workflow_call:
  push:
    branches: [001-live-sports-reliability]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out immutable playback core
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: 1de78b1e2690c22b50c060e986bce221454bf880
          path: shared-core
          persist-credentials: false
      - name: Apply the same reviewed patches used by the APK
        run: python3 scripts/patch_lounge_playback_core.py shared-core
      - name: Sports reliability backend regressions
        run: node --test backend/supabase/functions/lounge-sports-candidates-qa/test/*.test.mjs backend/supabase/functions/lounge-sports-candidates/test/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Branding and Python guardrails
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate_loungetv_brand_assets.py
          python3 scripts/extract_loungetv_hero_assets.py
          python3 scripts/check_branding.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All-sport event evidence regressions
        run: |
          node --test services/event-streams-qa/test/*.test.mjs
          python3 -m unittest discover -s services/event-streams-qa/test -p 'test_*.py'
      - name: Collect and validate real fixtures in an isolated runtime
        run: |
          python3 services/event-streams-qa/collect.py
          node services/event-streams-qa/src/validate.mjs > outputs/event-streams-qa/validation.log
          python3 services/event-streams-qa/probe.py
          QA_HEALTH_DATA=outputs/event-streams-qa/health.json node services/event-streams-qa/src/validate.mjs > outputs/event-streams-qa/validation.log
          QA_HEALTH_DATA=outputs/event-streams-qa/health.json node services/event-streams-qa/src/server.mjs > outputs/event-streams-qa/endpoint.log 2>&1 &
          echo "SPORTS_QA_ENDPOINT=http://127.0.0.1:18764/candidates" >> "$GITHUB_ENV"
          echo "QA_EVENT_CASES_FILE=$GITHUB_WORKSPACE/outputs/event-streams-qa/android-cases.json" >> "$GITHUB_ENV"
      - name: Core, playback and app unit tests without signing credentials
        env:
          QA_SIGNING_REQUIRED: 'false'
          PRODUCTION_SIGNING_REQUIRED: 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew :shared-core:core:testDebugUnitTest :shared-core:player-core:testDebugUnitTest :app:testStandardDebugUnitTest -Powntv.corePath="$GITHUB_WORKSPACE/shared-core" --stacktrace
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-regression-results
          path: |
            shared-core/core/build/test-results/**/*.xml
            shared-core/player-core/build/test-results/**/*.xml
            app/build/test-results/**/*.xml
            outputs/event-streams-qa/
          if-no-files-found: warn
