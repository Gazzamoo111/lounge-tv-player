name: Lounge TV one-time INERT DB rescue APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/db-rescue.yml'
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create isolated inert rescue module in CI workspace
        run: |
          set -euo pipefail
          mkdir -p rescue/src/main

          cat > rescue/build.gradle.kts <<'KTS'
          import java.util.Properties

          plugins {
              alias(libs.plugins.android.application)
          }

          android {
              namespace = "com.loungetv.rescue"

              compileSdk {
                  version = release(37) { minorApiLevel = 2 }
              }

              defaultConfig {
                  applicationId = "com.loungetv.player"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 5020303
                  versionName = "5.2.3.3-db-rescue-inert"
              }

              val keyFile = System.getenv("KEYSTORE_FILE")
                  ?: throw GradleException("Missing KEYSTORE_FILE")
              val keyStorePassword = System.getenv("KEYSTORE_PASSWORD")
                  ?: throw GradleException("Missing KEYSTORE_PASSWORD")
              val keyAliasValue = System.getenv("KEY_ALIAS")
                  ?: throw GradleException("Missing KEY_ALIAS")
              val keyPasswordValue = System.getenv("KEY_PASSWORD")
                  ?: throw GradleException("Missing KEY_PASSWORD")

              signingConfigs {
                  create("production") {
                      storeFile = file(keyFile)
                      storePassword = keyStorePassword
                      keyAlias = keyAliasValue
                      keyPassword = keyPasswordValue
                  }
              }

              buildTypes {
                  release {
                      isDebuggable = true
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("production")
                  }
              }
          }
          KTS

          cat > rescue/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:debuggable="true"
                  android:hasCode="false"
                  android:label="Lounge TV DB Rescue"
                  android:supportsRtl="true" />
          </manifest>
          XML

          printf '\ninclude(":rescue")\n' >> settings.gradle.kts

      - name: Load production signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!n:-}" ] || { echo "Missing $n secret"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loungetv.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/loungetv.keystore" >> "$GITHUB_ENV"

      - name: Build inert production-signed rescue APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: '5020303'
          VERSION_NAME: '5.2.3.3-db-rescue-inert'
          PRODUCTION_SIGNING_REQUIRED: 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :rescue:assembleRelease --stacktrace
          mkdir -p dist
          cp rescue/build/outputs/apk/release/*.apk dist/LoungeTV-DB-Rescue-INERT-5020303.apk

      - name: Verify package, certificate, version, debuggable and inert manifest
        run: |
          set -euo pipefail
          APK=dist/LoungeTV-DB-Rescue-INERT-5020303.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          t = Path(os.environ["RUNNER_TEMP"])
          cert = (t / "signature.txt").read_text()
          badge = (t / "badging.txt").read_text()
          manifest = (t / "manifest.txt").read_text()

          expected_cert = "7541bd80e141e48650e952cec62de1daa6491adcc4fab522613f1954fce8b6f9"
          assert expected_cert in cert.lower().replace(":", ""), "Wrong production certificate"
          assert "name='com.loungetv.player'" in badge, "Wrong package"
          assert "versionCode='5020303'" in badge, "Wrong version code"
          assert re.search(r'android:debuggable.*0xffffffff', manifest, re.I), "APK is not debuggable"

          forbidden = [
              "E: receiver",
              "E: service",
              "E: provider",
              "E: activity",
              "android.permission.INTERNET",
              "android.intent.action.MY_PACKAGE_REPLACED",
              "android.intent.action.BOOT_COMPLETED",
              "androidx.work",
          ]
          found = [x for x in forbidden if x in manifest]
          assert not found, f"Rescue APK is not inert; found: {found}"

          print("PASS: correct production package/cert/version, debuggable, zero app components, zero sync/network hooks.")
          PY

          sha256sum "$APK" > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LoungeTV-DB-Rescue-INERT-5020303
          path: dist/*
          if-no-files-found: error
          retention-days: 3
