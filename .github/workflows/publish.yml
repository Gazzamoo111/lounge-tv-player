name: Build and approve Lounge TV release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Four numbers, e.g. 5.2.1.0 (must increase each release)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: loungetv-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/playback-tests.yml
  candidate:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Checkout immutable OwnTV playback core for Lounge TV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: 1de78b1e2690c22b50c060e986bce221454bf880
          path: shared-core
          persist-credentials: false
      - name: Apply reviewed Lounge TV playback fixes
        run: python3 scripts/patch_lounge_playback_core.py shared-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Render transparent Lounge TV couch icons
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate_loungetv_brand_assets.py
      - name: Check branding and release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python3 scripts/version_code.py "$VERSION_NAME")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          python3 scripts/check_branding.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          if gh release view "v$VERSION_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION_NAME exists; refusing to overwrite."
            exit 1
          fi
          python3 scripts/assert_new_version.py "$VERSION_NAME" "$VERSION_CODE"
      - name: Decode independent Lounge TV signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!n:-}" ] || { echo "Missing $n secret"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loungetv.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/loungetv.keystore" >> "$GITHUB_ENV"
      - name: Build signed candidate for Fire TV testing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          PRODUCTION_SIGNING_REQUIRED: 'true'
          EXPECTED_PRODUCTION_CERT_SHA256: 7541bd80e141e48650e952cec62de1daa6491adcc4fab522613f1954fce8b6f9
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_PRODUCTION_CERT_SHA256" ] || { echo "Missing PRODUCTION_CERT_SHA256 repository variable"; exit 1; }
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardRelease :app:assembleX86_64Release -Powntv.corePath="$GITHUB_WORKSPACE/shared-core" --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/*.apk dist/LoungeTV.apk
          cp app/build/outputs/apk/x86_64/release/*.apk "dist/LoungeTV-x86_64-v${VERSION_NAME}.apk"
          previous_tag=$(gh release view --json tagName --jq .tagName -R "$GITHUB_REPOSITORY")
          mkdir -p previous
          gh release download "$previous_tag" --pattern LoungeTV.apk --dir previous -R "$GITHUB_REPOSITORY"
          python3 scripts/verify_update_compatibility.py dist/LoungeTV.apk \
            --previous previous/LoungeTV.apk \
            --expected-package com.loungetv.player \
            --expected-cert-sha256 "$EXPECTED_PRODUCTION_CERT_SHA256" \
            --expected-version-code "$VERSION_CODE"
          python3 scripts/verify_update_compatibility.py "dist/LoungeTV-x86_64-v${VERSION_NAME}.apk" \
            --expected-package com.loungetv.player \
            --expected-cert-sha256 "$EXPECTED_PRODUCTION_CERT_SHA256" \
            --expected-version-code "$VERSION_CODE"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Save exact release candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: LoungeTV-signed-candidate
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LoungeTV-signed-candidate
          path: dist
      - name: Publish exact candidate after human approval
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(python3 -c 'import sys; s=list(map(int,sys.argv[1].split("."))); print(s[0]*1000000+s[1]*10000+s[2]*100+s[3])' "$VERSION_NAME")
          sha256sum -c dist/SHA256SUMS.txt --ignore-missing
          if gh release view "v$VERSION_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION_NAME already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "v$VERSION_NAME" dist/LoungeTV.apk "dist/LoungeTV-x86_64-v$VERSION_NAME.apk" dist/SHA256SUMS.txt \
            --title "Lounge TV v$VERSION_NAME" \
            --notes "Android versionCode: $VERSION_CODE. Lounge TV update. Based on OwnTV (GPLv3). Source and build files in this repository." \
            --target "$GITHUB_SHA" --latest -R "$GITHUB_REPOSITORY"
