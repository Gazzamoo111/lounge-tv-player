name: Lounge TV scheduled AU EPG | 3-day minimum and honest 24-7
run-name: ${{ inputs.candidate_only && 'Read-only bulk EPG candidate' || '' }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/epg-rolling7-au-247.yml', 'qa/epg/**']
  pull_request:
    branches: [main, feature/lounge-tv-2.0]
    paths: ['.github/workflows/epg-rolling7-au-247.yml', 'qa/epg/**']
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      candidate_only:
        description: 'Validate the bulk EPG without publishing'
        type: boolean
        default: false
      prepare_release:
        description: 'Retain private release packages and rehearse International restore'
        type: boolean
        default: false
      shared_release_package:
        description: 'Approved shared release package run and attempt (blank for candidate)'
        type: string
      shared_release_sha256:
        description: 'Approved shared archive SHA-256 (blank for candidate)'
        type: string
      international_action:
        description: 'Separately approved International operation'
        type: choice
        options: ['none', 'publish', 'restore']
        default: 'none'
      international_package:
        description: 'Approved International package run and attempt'
        type: string
      international_sha256:
        description: 'Approved International gzip SHA-256'
        type: string
      international_expected_version:
        description: 'Expected serving International object version'
        type: string
permissions:
  contents: read
concurrency:
  group: lounge-epg-shared-publish
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'workflow_dispatch' ||
       (!inputs.candidate_only && vars.LOUNGE_EPG_BULK_MODE != 'candidate'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed Australian generator and regression tests
        uses: actions/checkout@v4
      - name: Checkout immutable original channel manifest separately
        uses: actions/checkout@v4
        with:
          ref: 7aa9b2406eda33bcad7d07983ff68abb491a57d5
          path: epg-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XML parser
        run: python -m pip install lxml==5.4.0
      - name: Run regression suite first
        run: python -m unittest discover -s qa/epg -v
      - name: Download existing guide and Australian schedules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lounge-epg7
          SOURCE_HEAD="$(git ls-remote origin refs/heads/epg-data | cut -f1)"
          test -n "$SOURCE_HEAD"
          echo "$SOURCE_HEAD" > /tmp/lounge-epg7/source-head.txt
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            "https://raw.githubusercontent.com/Gazzamoo111/lounge-tv-player/$SOURCE_HEAD/epg/guide.xml.gz" \
            -o /tmp/lounge-epg7/existing.xml.gz
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://iptv-epg.org/files/epg-au.xml.gz \
            -o /tmp/lounge-epg7/au-primary.xml.gz || true
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://i.mjh.nz/au/Sydney/epg.xml.gz \
            -o /tmp/lounge-epg7/au-sydney.xml.gz || true
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://xmltv.net/xml_files/Sydney.xml \
            -o /tmp/lounge-epg7/au-xmltv-net.xml || true
          # Optional, AU-specific programme source with verified Fox Cricket and Fox Sports News IDs.
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://epgshare01.online/epgshare01/epg_ripper_AU1.xml.gz \
            -o /tmp/lounge-epg7/au-epgshare.xml.gz || true
          test -s /tmp/lounge-epg7/existing.xml.gz
      - name: Build three-day-minimum AU guide and seven-day 24/7 labels
        run: |
          set -euo pipefail
          # Keep the serving canonical refresh on its reviewed generator while
          # the newer AU bindings are evaluated by the separate bulk job.
          legacy_generator=55c98e2cd237bbea904b64b9c9151572bdcdc7b1
          git fetch --no-tags --depth=1 origin "$legacy_generator"
          git show "$legacy_generator:qa/epg/seven_day_targeted.py" > /tmp/lounge-epg7/legacy-generator.py
          python /tmp/lounge-epg7/legacy-generator.py \
            --manifest epg-release/qa/epg/active-release.json \
            --existing /tmp/lounge-epg7/existing.xml.gz \
            --au primary=/tmp/lounge-epg7/au-primary.xml.gz \
            --au sydney=/tmp/lounge-epg7/au-sydney.xml.gz \
            --au xmltv-net=/tmp/lounge-epg7/au-xmltv-net.xml \
            --au epgshare=/tmp/lounge-epg7/au-epgshare.xml.gz \
            --out qa/epg/rolling7-out
      - name: Enforce publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timedelta
          from lxml import etree
          import gzip
          r=json.loads(Path('qa/epg/rolling7-out/report.json').read_text())
          assert r['auChannels']==38
          assert r['loopChannels']==672
          assert r['auChannelsWithThreeDaySource']>0
          assert r['minimumRealDays']==3
          assert r['auChannelsWithSevenDaySource']<=r['auChannelsWithThreeDaySource']
          assert r['loopChannelsNewlyCovered']>0
          assert r['untouchedExistingProgrammeEntries'] == r['existingProgrammeEntries']
          assert datetime.fromisoformat(r['requiredThroughUtc']) - datetime.fromisoformat(r['generatedAtUtc']) == timedelta(days=3)
          assert datetime.fromisoformat(r['preferredThroughUtc']) - datetime.fromisoformat(r['generatedAtUtc']) == timedelta(days=7)
          with gzip.open('qa/epg/rolling7-out/guide.xml.gz','rb') as file:
            tree=etree.parse(file)
          changed=set(r['changedEpgIds'])
          assert len(changed)>100
          assert all(tree.xpath('channel[@id=$cid]',cid=cid) for cid in changed)
          print('EPG_AU_THREE_DAY_GATE_PASS',r['auChannelsWithThreeDaySource'],r['auChannelsWithSevenDaySource'],r['loopChannelsNewlyCovered'])
          PY
      - name: Attach exact source revision for atomic compare-and-swap
        run: cp /tmp/lounge-epg7/source-head.txt qa/epg/rolling7-out/source-head.txt
      - name: Retain candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: rolling7-candidate
          path: |
            qa/epg/rolling7-out/report.json
            qa/epg/rolling7-out/guide.xml.gz
            qa/epg/rolling7-out/short/
            qa/epg/rolling7-out/source-head.txt
          retention-days: 7

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout only published EPG data
        uses: actions/checkout@v4
        with:
          ref: epg-data
          path: published
      - name: Download validated guide
        uses: actions/download-artifact@v4
        with:
          name: rolling7-candidate
          path: reviewed
      - name: Replace only central EPG data, never channel catalogue
        shell: bash
        run: |
          set -euo pipefail
          test -s reviewed/guide.xml.gz
          test -s reviewed/report.json
          SOURCE_HEAD="$(cat reviewed/source-head.txt)"
          ACTUAL_HEAD="$(git -C published rev-parse HEAD)"
          REMOTE_HEAD="$(git -C published ls-remote origin refs/heads/epg-data | cut -f1)"
          if [ "$SOURCE_HEAD" != "$ACTUAL_HEAD" ] || [ "$ACTUAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "EPG data changed after QA validation; refusing stale promotion"
            exit 1
          fi
          cp reviewed/guide.xml.gz published/epg/guide.xml.gz
          gzip -dc reviewed/guide.xml.gz > published/epg/guide.xml
          mkdir -p published/epg/short
          cp reviewed/short/*.json published/epg/short/
          cp reviewed/report.json published/epg/rolling7-au-247-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('published/epg/rolling7-au-247-report.json')
          r=json.loads(p.read_text())
          r['previousGuideGitSha']=Path('reviewed/source-head.txt').read_text().strip()
          p.write_text(json.dumps(r,indent=2)+chr(10))
          PY
          cd published
          git config user.name 'Lounge TV EPG Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guide.xml.gz epg/guide.xml epg/short epg/rolling7-au-247-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'epg: refresh Australian schedules with three-day minimum and honest 24/7 labels'
          git push origin HEAD:epg-data

  bulk:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.candidate_only &&
      !inputs.shared_release_package && inputs.international_action == 'none' &&
      vars.LOUNGE_EPG_BULK_MODE == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      BROKER_URL: https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-international-epg-broker-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select private runner workspace
        run: printf 'WORK=%s\n' "$RUNNER_TEMP/lounge-epg-bulk" >> "$GITHUB_ENV"
      - name: Check out the reviewed catalogue replay and protected regressions
        uses: actions/checkout@v4
        with:
          repository: Gazzamoo111/lounge-tv-feed
          ref: 46a6cc00d6a90fe2660f8641660623984d5719ec
          path: feed-regression
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install lxml==5.4.0
      - run: python -m unittest discover -s qa/epg -v
      - name: Run protected playback routing regressions
        working-directory: feed-regression
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            68be2022dc70675c351a8a6fc5435ae1f4079efa \
            589ecddb085352585d3f7d3b6a65ecc2ad444b68 \
            db443bb775bea37a92339db2443b418ea8222386 \
            f8bc7ab33542bda9daedf1839cd23d980f4b6a7c
          python -m unittest discover -s tests/playlist_regression
          python scripts/run_playlist_regression.py
      - name: Obtain a read token for the private International guide
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('loungetv-international-epg-qa');
            core.setSecret(token);
            core.exportVariable('LOUNGE_QA_OIDC', token);
      - name: Capture full authenticated catalogue and current guide versions
        env:
          NZ_AU_M3U: ${{ secrets.LOUNGE_EPG_NZ_AU_QA_M3U }}
          PLUS_M3U: ${{ secrets.LOUNGE_EPG_PLUS_QA_M3U }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK"
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import urlsplit
          url = os.environ['NZ_AU_M3U'] or os.environ['PLUS_M3U']
          endpoint = urlsplit(url)
          work = Path(os.environ['WORK'])
          if ((endpoint.scheme, endpoint.netloc, endpoint.path) != ('https', 'n.loungetv.nz', '/get.php')
                  or any(ord(c) < 33 or c in (chr(34), chr(92)) for c in url)):
              raise SystemExit('A valid authenticated Lounge TV gateway playlist secret is required')
          subprocess.run(['curl', '--config', '-', '--fail', '--silent',
                          '--compressed', '--max-filesize', '20000000', '--max-time', '90',
                          '--dump-header', str(work / 'account.headers'),
                          '--output', str(work / 'authenticated.m3u')],
                         input=f'url = "{url}"' + chr(10), text=True, check=True)
          headers = (work / 'account.headers').read_text().lower().splitlines()
          markers = [line.split(':', 1)[1].strip() for line in headers
                     if line.startswith('x-lounge-catalogue:')]
          if markers not in ([], ['plus-qa']):
              raise SystemExit('Unexpected playlist variant')
          (work / 'authenticated-profile').write_text('plus' if markers else 'nz-au')
          PY
          curl -fsS --max-time 90 --max-filesize 10000000 -o "$WORK/catalogue.json" \
            -H "Authorization: Bearer $LOUNGE_QA_OIDC" "$BROKER_URL/bulk-catalogue"
          curl -fsS --max-time 90 --max-filesize 20000000 -o "$WORK/international.m3u" \
            -H "Authorization: Bearer $LOUNGE_QA_OIDC" "$BROKER_URL/bulk-regional-playlist"
          curl -fsS --max-time 90 --max-filesize 49000000 -D "$WORK/international.headers" \
            -H "Authorization: Bearer $LOUNGE_QA_OIDC" "$BROKER_URL/bulk-baseline" \
            -o "$WORK/international-before.xml.gz"
          head="$(git ls-remote origin refs/heads/epg-data | cut -f1)"
          test "${#head}" = 40
          printf '%s\n' "$head" > "$WORK/source-head"
          canonical="https://raw.githubusercontent.com/Gazzamoo111/lounge-tv-player/$head/epg"
          curl -fsS --max-time 120 "$canonical/guide.xml.gz" -o "$WORK/canonical.xml.gz"
          code="$(curl -sS --max-time 120 -w '%{http_code}' "$canonical/bulk/guide.xml.gz" -o "$WORK/previous")"
          case "$code" in
            200) ;;
            404) rm "$WORK/previous" ;;
            *) exit 1 ;;
          esac
      - name: Replay both catalogues from the current Supabase snapshot
        run: |
          set -euo pipefail
          umask 077
          for slug in n lounge-plus-qa; do
            python feed-regression/scripts/restore_playlist_baseline.py --repo feed-regression \
              --function "$slug" --output "$WORK/bundle-$slug"
          done
          mkdir "$WORK/bundles"
          mv "$WORK/bundle-n/n" "$WORK/bundle-lounge-plus-qa/lounge-plus-qa" "$WORK/bundles/"
          node feed-regression/tests/playlist_regression/replay.mjs \
            "$WORK/bundles" "$WORK/profiles" "$WORK/catalogue.json"
          PYTHONPATH=qa/epg python - <<'PY'
          import os
          from pathlib import Path
          from bulk_guide import load_catalogue
          work = Path(os.environ['WORK'])
          authenticated_profile = (work / 'authenticated-profile').read_text()
          actual = load_catalogue(work / 'authenticated.m3u')
          received = work / 'profiles' / (authenticated_profile + '.m3u')
          expected = load_catalogue(received)
          if [row.key for row in actual] != [row.key for row in expected]:
              raise SystemExit(f'Authenticated {authenticated_profile} stable IDs/order differ from the pinned replay '
                               f'({len(actual)} vs {len(expected)} rows)')
          if actual != expected:
              raise SystemExit(f'Authenticated {authenticated_profile} catalogue metadata differs from the pinned replay')
          print(f'Authenticated {authenticated_profile} verified: {len(actual)} stable IDs in the expected order')
          (work / 'authenticated.m3u').replace(received)
          PY
      - name: Validate combined XMLTV and record source health
        run: |
          set -euo pipefail
          for file in "$WORK"/profiles/{nz-au,plus}.m3u "$WORK"/international.m3u; do
            test "$(grep -c '^#EXTINF:' "$file")" -ge 10000
          done
          previous=()
          if test -s "$WORK/previous"; then previous=(--previous-bulk "$WORK/previous"); fi
          python qa/epg/bulk_guide.py \
            --profile nz-au="$WORK/profiles/nz-au.m3u" --profile plus="$WORK/profiles/plus.m3u" \
            --profile international="$WORK/international.m3u" \
            --baseline "$WORK/canonical.xml.gz" --international-baseline "$WORK/international-before.xml.gz" \
            "${previous[@]}" --cache "$WORK/sources" --out "$WORK/candidate"
          python - <<'PY'
          from datetime import datetime
          from hashlib import file_digest
          import json, os
          from pathlib import Path
          base = Path(os.environ['WORK']) / 'candidate'
          report = json.loads((base / 'report.json').read_text())
          groups = report['after']
          if not any(r.get('shared_programmes', 0) for r in report['contributions'].values()) and not (base.parent / 'previous').exists():
              raise SystemExit('initial build provided no shared schedule gains')
          if not report['international_compiled_baseline_used'] or (base / 'international-master.xml.gz').stat().st_size >= 49000000:
              raise SystemExit('compiled guide failed its publication bounds')
          manifest = {'generated_at': report['generated_at'],
                      'revision': datetime.fromisoformat(report['generated_at']).strftime('%Y%m%d%H%M%S'),
                      'baseline_head': (base.parent / 'source-head').read_text().strip(),
                      'guides': report['guides'],
                      'coverage': {p: groups[p]['categories']['TOTAL'] for p in groups},
                      'sources': {name: {k: status[k] for k in ('status', 'latest_stop', 'accepted_ids') if k in status}
                                  for name, status in report['source_health'].items()}}
          (base / 'manifest.json').write_text(json.dumps(manifest, indent=2) + chr(10))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              print('## Authenticated bulk EPG candidate', file=summary)
              print(file=summary)
              print(f"Generated {manifest['generated_at']} from canonical revision "
                    f"`{manifest['baseline_head']}`.", file=summary)
              print(file=summary)
              auth_profile = (base.parent / 'authenticated-profile').read_text()
              print('| Profile | Source | Eligible | Mapped | Current | Next | Both |', file=summary)
              print('| --- | --- | ---: | ---: | ---: | ---: | ---: |', file=summary)
              for name, data in groups.items():
                  before = report['before'][name]['categories']['TOTAL']
                  after = data['categories']['TOTAL']
                  changes = ' | '.join(f'{before[k]} → {after[k]}' for k in ('mapped', 'current', 'next', 'both'))
                  origin = ('Existing QA broker' if name == 'international' else
                            'Authenticated BEST account' if name == auth_profile else
                            'Supabase replay; separate account unverified')
                  print(f"| {name} | {origin} | {after['eligible']} | {changes} |", file=summary)
              print(file=summary)
              for label, path in [('Shared candidate', base / 'guide.xml.gz'),
                                  ('International candidate', base / 'international-master.xml.gz'),
                                  ('International rollback baseline', base.parent / 'international-before.xml.gz')]:
                  with path.open('rb') as guide:
                      digest = file_digest(guide, 'sha256').hexdigest()
                  print(f'- {label} SHA-256 `{digest}`', file=summary)
              print(f"- Shared short guides: {sum(1 for _ in (base / 'short').glob('*.json'))}", file=summary)
              print(f"- Canonical 24/7 labels retained: {report['continuous_labels_retained']}", file=summary)
              print(f"- Shared short listings verified: {report['short_listings_verified']}", file=summary)
          PY
      - name: Renew the token for private staging
        if: inputs.prepare_release
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('loungetv-international-epg-qa');
            core.setSecret(token);
            core.exportVariable('LOUNGE_QA_OIDC', token);
      - name: Stage release packages and verify International restore on a non-serving object
        if: inputs.prepare_release
        run: bash qa/epg/prepare_bulk_release.sh

  publish_shared_only:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.candidate_only && !inputs.prepare_release && inputs.shared_release_package &&
      inputs.international_action == 'none' && vars.LOUNGE_EPG_SHARED_PUBLISH == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: epg-data
          path: published
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the approved private package
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('loungetv-international-epg-qa');
            core.setSecret(token);
            core.exportVariable('LOUNGE_QA_OIDC', token);
      - name: Verify and publish the shared paths only
        env:
          RELEASE_PACKAGE: ${{ inputs.shared_release_package }}
          RELEASE_DIGEST: ${{ inputs.shared_release_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_PACKAGE" =~ ^[1-9][0-9]{5,15}-[1-9][0-9]{0,3}$ ]]
          [[ "$RELEASE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          package="$RUNNER_TEMP/shared.tar.gz"
          curl --fail --silent --show-error --max-time 90 --max-filesize 49000000 \
            -H "Authorization: Bearer $LOUNGE_QA_OIDC" \
            "https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-international-epg-broker-qa/bulk-stage-shared?run=$RELEASE_PACKAGE" \
            -o "$package"
          python qa/epg/stage_shared_publication.py "$package" "$RELEASE_DIGEST" published
          cd published
          base="$(git rev-parse HEAD)"
          test "$base" = "$(git ls-remote origin refs/heads/epg-data | cut -f1)"
          git add -- epg/bulk
          git diff --cached --quiet && exit 0
          git config user.name 'Lounge TV EPG Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "epg: publish approved shared guide $RELEASE_PACKAGE"
          git push origin HEAD:epg-data

  international_only:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.candidate_only && !inputs.prepare_release && !inputs.shared_release_package &&
      (inputs.international_action == 'publish' || inputs.international_action == 'restore') &&
      vars.LOUNGE_EPG_INTERNATIONAL_PUBLISH == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('loungetv-international-epg-qa');
            core.setSecret(token);
            core.exportVariable('LOUNGE_QA_OIDC', token);
      - name: Apply the version-checked International operation
        env:
          RELEASE_ACTION: ${{ inputs.international_action }}
          RELEASE_PACKAGE: ${{ inputs.international_package }}
          RELEASE_DIGEST: ${{ inputs.international_sha256 }}
          EXPECTED_VERSION: ${{ inputs.international_expected_version }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_PACKAGE" =~ ^[1-9][0-9]{5,15}-[1-9][0-9]{0,3}$ ]]
          [[ "$RELEASE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[a-f0-9-]{36}$ ]]
          broker="https://liqocisegeqzbyuqloql.supabase.co/functions/v1/lounge-international-epg-broker-qa"
          cd "$(mktemp -d)"
          request() {
            curl --fail --silent --show-error --max-time 130 -H "Authorization: Bearer $LOUNGE_QA_OIDC" "$@"
          }
          request "$broker/bulk-stage-international-rollback?run=$RELEASE_PACKAGE" -o backup.xml.gz
          package=backup.xml.gz
          if [ "$RELEASE_ACTION" = publish ]; then
            request "$broker/bulk-baseline" -o before.xml.gz
            cmp backup.xml.gz before.xml.gz
            request "$broker/bulk-stage-international?run=$RELEASE_PACKAGE" -o candidate.xml.gz
            package=candidate.xml.gz
          fi
          test "$(sha256sum "$package" | cut -d' ' -f1)" = "$RELEASE_DIGEST"
          gzip -t "$package"
          request -X PUT -H 'Content-Type: application/gzip' -H "X-Lounge-Guide-Version: $EXPECTED_VERSION" \
            --data-binary "@$package" "$broker/bulk-upload" -o /dev/null
          request -D headers "$broker/bulk-baseline" -o readback.xml.gz
          cmp "$package" readback.xml.gz
          awk 'tolower($1)=="x-lounge-guide-version:" {print "Verified serving object version "$2}' headers
